[alembic]
# Path to migration scripts, relative to this file's directory (backend/).
script_location = migrations

# Prepend the backend directory to sys.path so `app.*` imports resolve
# regardless of the working directory the alembic command is run from.
prepend_sys_path = .

# Human-friendly, chronologically ordered revision filenames.
file_template = %%(year)d%%(month)d%%(day)d_%%(rev)s_%%(slug)s

version_path_separator = os

# NOTE: the database URL is NOT stored here. migrations/env.py injects it from
# app settings (the DATABASE_URL environment variable), so the same migrations
# run against local SQLite and the production Supabase Postgres without
# hardcoding credentials in source control.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
